name: release

# 发布 nfoSceneParser 插件：
#   1. 打包 zip（插件 .py + .yml）
#   2. 计算 sha256 + 北京时间戳 + 下载 URL
#   3. clone stash-plugins 仓库 → 同一 commit 更新 index.yml + README 版本表 → push
#      （单次 push 只触发一次 Pages 部署；stash-plugins 侧 sync-readme.yml 保留作兜底，
#        README 已同步时其幂等检查不会再产生 commit）
#   4. 创建 GitHub Release（上传 zip）
# 需要 STASH_PLUGINS_TOKEN secret（PAT with repo scope）跨仓库 push。
# secret 未设置时跳过 index.yml 更新，仅创建 release。

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Pack zip
        run: |
          zip "nfoSceneParser-v${{ steps.ver.outputs.version }}.zip" \
            nfoSceneParser.yml \
            nfoSceneParser.py \
            nfoParser.py \
            abstractParser.py \
            config.py \
            log.py \
            reParser.py \
            stashInterface.py

      - name: Compute metadata
        id: meta
        run: |
          ZIP="nfoSceneParser-v${{ steps.ver.outputs.version }}.zip"
          SHA=$(sha256sum "$ZIP" | awk '{print $1}')
          TS=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          PATH_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}/${ZIP}"
          {
            echo "sha=$SHA"
            echo "ts=$TS"
            echo "path_url=$PATH_URL"
          } >> "$GITHUB_OUTPUT"
          echo "=== Metadata ==="
          echo "zip      : $ZIP"
          echo "sha256   : $SHA"
          echo "date     : $TS"
          echo "path     : $PATH_URL"

      - name: Update stash-plugins index.yml and README
        env:
          PLUGIN_ID: nfoSceneParser
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          DATE: ${{ steps.meta.outputs.ts }}
          PATH_URL: ${{ steps.meta.outputs.path_url }}
          SHA: ${{ steps.meta.outputs.sha }}
          STASH_PLUGINS_TOKEN: ${{ secrets.STASH_PLUGINS_TOKEN }}
        run: |
          if [ -z "$STASH_PLUGINS_TOKEN" ]; then
            echo "⚠ STASH_PLUGINS_TOKEN secret not set — skipping index.yml update"
            echo "  Manual update needed: clone k6cc/stash-plugins, update plugins/main/index.yml"
            exit 0
          fi
          git clone https://x-access-token:${STASH_PLUGINS_TOKEN}@github.com/k6cc/stash-plugins.git /tmp/stash-plugins
          cd /tmp/stash-plugins
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 竞争安全：多个 release 并发推送时 push 可能被拒（non-fast-forward），
          # 每次重试前 fetch + reset 到远程最新（已包含其他插件刚推的改动），
          # 再重新套用本插件的 index.yml 更新与 README 同步。
          # index.yml 与 README 版本表放同一个 commit：一次 push 只触发一次 Pages 部署
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            # awk 只更新匹配 PLUGIN_ID 的条目，避免误改其他插件
            awk -v id="$PLUGIN_ID" -v version="$VERSION" -v date="$DATE" -v path="$PATH_URL" -v sha="$SHA" '
            /^- id: / { in_block = ($3 == id) }
            in_block && /^  version: / { print "  version: " version; next }
            in_block && /^  date: / { print "  date: " date; next }
            in_block && /^  path: / { print "  path: " path; next }
            in_block && /^  sha256: / { print "  sha256: " sha; next }
            { print }
            ' plugins/main/index.yml > /tmp/index.yml && mv /tmp/index.yml plugins/main/index.yml
            # 从 index.yml 同步 README 版本表（复用仓库自带脚本，幂等）；
            # 失败不阻塞 index.yml 提交，README 由 stash-plugins 的 sync-readme.yml 兜底
            python3 scripts/sync_readme.py || echo "⚠ sync_readme.py failed — README left to fallback workflow"
            git add plugins/main/index.yml README.md
            if git diff --cached --quiet; then
              echo "index.yml and README.md already up to date — nothing to commit"
              exit 0
            fi
            git commit -m "chore: bump ${PLUGIN_ID} to ${TAG}"
            if git push; then
              echo "=== Pushed index.yml + README update (attempt ${attempt}) ==="
              cat plugins/main/index.yml
              exit 0
            fi
            echo "⚠ push failed (attempt ${attempt}) — concurrent release detected, retrying"
            sleep $((attempt * 5))
          done
          echo "✗ failed to push index.yml after 5 attempts"
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: nfoSceneParser-v${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
